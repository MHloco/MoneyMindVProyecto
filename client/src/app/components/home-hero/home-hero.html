<section class="hero">
  <span class="hero-eyebrow">Inteligencia financiera</span>

  <div class="v-stage">
    <div class="v-ring"></div>
    <div class="v-letter" [style.transform]="'rotate(' + angle + 'deg)'">V</div>
  </div>

  <p class="hero-sub">La mente que domina su dinero,<br />domina su futuro.</p>

  <div class="drag-hint">
    <span class="dot"></span>
    Arrastra la V para girarla
    <span class="dot"></span>
  </div>

  <div class="scroll-cue"></div>
</section>
